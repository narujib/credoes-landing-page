name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Format, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check .

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://credoes.id"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
          TURNSTILE_SECRET_KEY: "dummy_secret_key"
          RESEND_API_KEY: "dummy_resend_api_key"
          CONTACT_EMAIL_TO: "dummy@example.com"
          CONTACT_EMAIL_FROM: "dummy@example.com"
